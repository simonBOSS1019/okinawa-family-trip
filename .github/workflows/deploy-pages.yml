name: Deploy Okinawa Trip Website

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "control-panel.html"
      - "trip-data.json"
      - "assets/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate source website
        run: |
          set -euo pipefail
          test -f index.html
          test -f control-panel.html
          test -f trip-data.json
          test -d assets
          mkdir -p _site
          cp index.html control-panel.html trip-data.json _site/
          cp -a assets _site/assets
          test -f _site/assets/cover.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
