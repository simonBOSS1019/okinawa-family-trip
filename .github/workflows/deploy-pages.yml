name: Deploy Okinawa Trip Website

on:
  push:
    branches:
      - main
    paths:
      - "site-bundle.zip"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract website bundle
        run: |
          test -f site-bundle.zip || {
            echo "Missing site-bundle.zip. Upload the complete website ZIP to the repository root."
            exit 1
          }
          mkdir -p _site
          unzip -q site-bundle.zip -d _site
          test -f _site/index.html || {
            echo "The ZIP must contain index.html at its top level."
            exit 1
          }
          test -d _site/assets || {
            echo "The ZIP is missing the assets folder."
            exit 1
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
