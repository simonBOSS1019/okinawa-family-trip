name: Deploy Okinawa Trip Website

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "control-panel.html"
      - "trip-data.json"
      - "assets/**"
      - "site-bundle.zip"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare and validate website source
        env:
          EVENT_COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          set -euo pipefail

          # Use the source changed by this push. This lets a ZIP-only upload replace
          # the existing root files without allowing an old ZIP to override newer edits.
          ZIP_CHANGED="$(jq -r 'any(.[]?; (((.added // []) + (.modified // []) + (.removed // [])) | index("site-bundle.zip")) != null)' <<< "$EVENT_COMMITS")"
          ROOT_CHANGED="$(jq -r 'any(.[]?; any(((.added // []) + (.modified // []) + (.removed // []))[]; . == "index.html" or . == "control-panel.html" or . == "trip-data.json" or startswith("assets/")))' <<< "$EVENT_COMMITS")"

          if [[ "$ROOT_CHANGED" == "true" ]]; then
            SOURCE_DIR="$GITHUB_WORKSPACE"
            echo "Using website files changed in the repository root."
          elif [[ "$ZIP_CHANGED" == "true" ]]; then
            test -f site-bundle.zip || {
              echo "::error::The push changed site-bundle.zip, but the archive is missing."
              exit 1
            }
            mkdir -p _bundle
            unzip -q site-bundle.zip -d _bundle
            INDEX_PATH="$(find _bundle -type f -name index.html -print -quit)"
            test -n "$INDEX_PATH" || {
              echo "::error::site-bundle.zip does not contain index.html."
              exit 1
            }
            SOURCE_DIR="$(dirname "$INDEX_PATH")"
            echo "Using the newly uploaded site-bundle.zip."
          elif [[ -f index.html && -f control-panel.html && -f trip-data.json && -f assets/cover.png ]]; then
            SOURCE_DIR="$GITHUB_WORKSPACE"
            echo "Using the complete website files from the repository root."
          elif [[ -f site-bundle.zip ]]; then
            mkdir -p _bundle
            unzip -q site-bundle.zip -d _bundle
            INDEX_PATH="$(find _bundle -type f -name index.html -print -quit)"
            test -n "$INDEX_PATH" || {
              echo "::error::site-bundle.zip does not contain index.html."
              exit 1
            }
            SOURCE_DIR="$(dirname "$INDEX_PATH")"
            echo "Using the available site-bundle.zip fallback."
          else
            echo "::error::No complete website source was found in the repository root or site-bundle.zip."
            exit 1
          fi

          for required_file in index.html control-panel.html trip-data.json assets/cover.png; do
            test -f "$SOURCE_DIR/$required_file" || {
              echo "::error::Missing required website file: $required_file"
              exit 1
            }
          done

          mkdir -p _site
          cp "$SOURCE_DIR/index.html" "$SOURCE_DIR/control-panel.html" "$SOURCE_DIR/trip-data.json" _site/
          cp -a "$SOURCE_DIR/assets" _site/assets

          test -f _site/index.html
          test -f _site/control-panel.html
          test -f _site/trip-data.json
          test -f _site/assets/cover.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
